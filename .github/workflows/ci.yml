# Tests on every push / pull request; a tag like v0.2.0 also builds the installer and attaches it to the run.
# NOTE: written without being able to run it here; check the first run and adjust versions if needed.
name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint (undefined names)
        run: python -m pyflakes zapi main.py tools
        continue-on-error: true
      - name: Tests
        run: python -W error::SyntaxWarning -m unittest discover -s tests -t .
        env:
          QT_QPA_PLATFORM: offscreen

  installer:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: choco install innosetup -y --no-progress
      - name: Build (PyInstaller, selftest, Inno Setup)
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: Zapi-Setup
          path: dist/Zapi-Setup.exe
